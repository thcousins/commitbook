name: Test

# Builds the app and runs the unit and browser tests against a fake GitHub
# (no real data is touched). Screenshots and logs are published to the
# `ci-results` branch so they can be reviewed without downloading artifacts.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Unit tests
        run: |
          mkdir -p test-output
          npm run test:unit 2>&1 | tee test-output/unit.log
          exit ${PIPESTATUS[0]}
      - name: Build
        run: |
          npm run build 2>&1 | tee test-output/build.log
          exit ${PIPESTATUS[0]}
      - name: Install browsers
        id: browsers
        continue-on-error: true
        timeout-minutes: 14
        run: |
          mkdir -p test-output
          set -o pipefail
          # A fresh machine's automatic updates can hold the package lock; stop them and wait for the lock.
          sudo systemctl stop unattended-upgrades apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          echo 'DPkg::Lock::Timeout "180";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout > /dev/null
          echo "== system packages" | tee test-output/install.log
          ok=0
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              # Something else still holds the lock: stop it and tidy up before trying again.
              sudo pkill -9 -f 'apt-get|apt.systemd.daily|unattended-upgr' 2>/dev/null || true
              sleep 2
              sudo dpkg --configure -a > /dev/null 2>&1 || true
            fi
            if timeout 200 npx playwright install-deps chromium webkit > /tmp/deps.log 2>&1; then ok=1; break; fi
            echo "attempt $attempt failed:" | tee -a test-output/install.log
            tail -n 15 /tmp/deps.log | tee -a test-output/install.log
          done
          [ "$ok" = 1 ] || exit 1
          echo "== browsers" | tee -a test-output/install.log
          timeout 300 npx playwright install chromium webkit 2>&1 | tail -n 40 | tee -a test-output/install.log
      - name: Browser tests
        id: e2e
        if: steps.browsers.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 16
        run: |
          PW_PROJECTS="${{ vars.PW_PROJECTS || 'chromium,webkit' }}" npx playwright test 2>&1 | tee test-output/e2e.log
          exit ${PIPESTATUS[0]}
      - name: Publish results to the ci-results branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/results
          cp -r test-output/. /tmp/results/ 2>/dev/null || true
          cp package-lock.json /tmp/results/ 2>/dev/null || true
          mkdir -p /tmp/results/failures
          echo "${{ github.sha }} ${{ steps.e2e.outcome }} (browsers: ${{ steps.browsers.outcome }})" > /tmp/results/STATUS
          cd /tmp/results
          git init -q
          git checkout -q -b ci-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Test results for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
      - name: Fail if browser tests failed
        if: steps.e2e.outcome != 'success'
        run: exit 1
